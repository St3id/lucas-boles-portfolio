<!doctype html>
<!-- Tests de l'interface du démineur avec le serveur simulé : ouvrir http://localhost:8000/leaderboard/test-interface.html (python -m http.server à la racine du dépôt). -->
<meta charset="utf-8">
<body>
<pre id="out">pending</pre>
<iframe id="f" src="../minesweeper.html" style="width:1300px;height:900px"></iframe>
<script>
var log = [], step = 0;
function ok(c, l) { log.push((c ? "OK    " : "ECHEC ") + l); }
function tap(w, el) {
  var r = el.getBoundingClientRect(), o = { bubbles: true, pointerType: "mouse", button: 0, clientX: r.left + 5, clientY: r.top + 5 };
  el.dispatchEvent(new w.PointerEvent("pointerdown", o));
  el.dispatchEvent(new w.PointerEvent("pointerup", o));
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
// gagne la partie en cours en révélant les cases sûres, gap ms entre deux clics
async function winGame(w, d, gap, flagFirst) {
  var cells = function () { return d.querySelectorAll(".ms-board .ms-cell"); };
  await wait(400);                                  // laisse la graine arriver du serveur
  var g = w.__ms.game(), level = w.__ms.level();
  tap(w, cells()[0]);
  var b = w.MSCore.makeBoard(level, g.seed, 0);
  if (flagFirst) { await wait(gap); var m = b.mine.indexOf(true); cells()[m].dispatchEvent(new w.MouseEvent("contextmenu", { bubbles: true, cancelable: true })); }
  for (var i = 0; i < b.mine.length && !g.submitted && d.getElementById("ms-end").hidden; i++) {
    if (!b.mine[i] && !cells()[i].classList.contains("is-open")) { await wait(gap); tap(w, cells()[i]); }
  }
  await wait(600);
  return g;
}
f.onload = async function () {
  step++;
  var w = f.contentWindow, d = f.contentDocument;
  if (step === 1) {
    w.localStorage.clear();
    w.localStorage.setItem("ms-api-dev", JSON.stringify("mock"));
    w.location.reload();
    return;
  }
  if (step !== 2) return;
  await wait(500);
  ok(!d.getElementById("ms-ranking-tile").hidden, "tuile Classement visible (serveur configuré)");

  // 1re victoire : formulaire de pseudo
  var g = await winGame(w, d, 150);
  ok(g.ranked, "partie classée (graine reçue du serveur)");
  ok(!d.getElementById("ms-rank-form").hidden, "formulaire de pseudo affiché à la 1re victoire");
  ok(d.getElementById("ms-badges").textContent.indexOf("record") >= 0, "badges : " + d.getElementById("ms-badges").textContent);
  ok(d.getElementById("ms-best").textContent !== "-", "record affiché : " + d.getElementById("ms-best").textContent);
  var input = d.getElementById("ms-pseudo");
  input.value = "Connard";
  d.getElementById("ms-rank-form").requestSubmit();
  await wait(400);
  ok(/pas accepté/.test(d.getElementById("ms-rank-msg").textContent), "pseudo grossier refusé : " + d.getElementById("ms-rank-msg").textContent);
  input.value = "Lucas38";
  d.getElementById("ms-rank-form").requestSubmit();
  await wait(400);
  ok(/Lucas38 : nouveau record au classement, 1er/.test(d.getElementById("ms-rank-msg").textContent), "inscrit : " + d.getElementById("ms-rank-msg").textContent);
  var id = JSON.parse(w.localStorage.getItem("ms-identity-v1"));
  ok(id && id.pseudo === "Lucas38" && id.token, "pseudo et jeton mémorisés dans le navigateur");

  // 2e victoire : inscription automatique, sans formulaire
  d.getElementById("ms-end-new").click();
  await winGame(w, d, 120);
  ok(d.getElementById("ms-rank-form").hidden, "2e victoire : pas de formulaire");
  ok(/Lucas38 : (nouveau record|votre record)/.test(d.getElementById("ms-rank-msg").textContent), "2e victoire inscrite automatiquement : " + d.getElementById("ms-rank-msg").textContent);

  // classement affiché
  d.getElementById("ms-end-close").click();
  d.getElementById("ms-ranking-tile").click();
  await wait(500);
  var rows = d.querySelectorAll("#ms-rank-list li");
  ok(rows.length === 1 && rows[0].classList.contains("is-me"), "classement : " + rows.length + " ligne(s), la mienne en surbrillance : " + (rows[0] && rows[0].textContent));
  ok(/Lucas38/.test(d.getElementById("ms-rank-me").textContent), "« Vos temps sont inscrits au nom de Lucas38 »");
  ok(d.querySelectorAll("[data-rank-level]").length === 4 && !d.querySelector("[data-rank-cat]"), "classement : 4 onglets de niveau, plus de catégorie");
  d.querySelector("#ms-ranking [data-close]").click();

  // un autre navigateur ne peut pas prendre « lucas38 » : on simule en oubliant l'identité
  w.localStorage.removeItem("ms-identity-v1");
  // (l'identité en mémoire de la page est toujours là : on teste donc via le serveur)
  

  // partie avec le code Konami : hors classement
  var t = d.querySelector(".ms-title");
  for (var k = 0; k < 30; k++) t.click();
  ["up", "up", "down", "down", "left", "right", "left", "right", "b", "a"].forEach(function (key) { d.querySelector('[data-key="' + key + '"]').click(); });
  await wait(900);
  var cellsK = d.querySelectorAll(".ms-board .ms-cell");
  tap(w, cellsK[0]);
  await wait(200);
  Array.prototype.forEach.call(d.querySelectorAll(".ms-board .ms-cell"), function (c) { if (!c.classList.contains("is-open") && !c.classList.contains("is-peek")) tap(w, c); });
  await wait(500);
  ok(/code secret/.test(d.getElementById("ms-rank-msg").textContent) && d.getElementById("ms-rank-form").hidden, "partie Konami : " + d.getElementById("ms-rank-msg").textContent);
  ok(!/record/.test(d.getElementById("ms-badges").textContent), "partie Konami : pas de record");

  // Nouvelle partie : fenêtre avec le slider de difficulté
  d.getElementById("ms-end-close").click();
  d.getElementById("ms-new").click();
  var pick = d.getElementById("ms-pick"), range = d.getElementById("ms-pick-range");
  ok(pick.open && d.getElementById("ms-pick-name").textContent === "Bac à sable", "fenêtre Nouvelle partie ouverte sur le niveau en cours");
  range.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
  range.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
  d.getElementById("ms-pick-go").click();
  ok(!pick.open && w.__ms.level() === "hard" && d.querySelectorAll(".ms-board .ms-cell").length === 22 * 22, "deux crans à droite puis C'est parti : partie en Champ de mines");
  ok(JSON.parse(w.localStorage.getItem("ms-level-v1")) === "hard", "niveau gardé pour la prochaine visite");
  ok(d.getElementById("ms-podium-level").textContent === "Champ de mines", "podium sur le niveau en cours");
  d.getElementById("ms-podium-next").click();
  ok(d.getElementById("ms-podium-level").textContent === "Bac à sable" && w.__ms.level() === "hard", "flèche du podium : Sans drapeau sauté tant que l'énigme n'est pas résolue, partie inchangée");
  ok(d.querySelector('[data-rank-level="noflag"]').hidden, "classement : onglet Sans drapeau caché avant l'énigme");
  d.getElementById("ms-new").click();
  d.getElementById("ms-pick-cancel").click();
  ok(!pick.open && w.__ms.level() === "hard", "Annuler : rien ne change");

  // mode Sans drapeau : caché tant que la case n'est pas creusée
  d.getElementById("ms-new").click();
  ok(d.getElementById("ms-pick-nf").hidden && !pick.classList.contains("is-unlocked"), "Sans drapeau caché au départ");
  var btn = function (k) { var p = k.split(","); return d.querySelector('.ms-pick-dig button[data-r="' + p[0] + '"][data-c="' + p[1] + '"]'); };
  var dig = function (k) { var b = btn(k); if (b) b.click(); };
  var closedAll = function () { return d.querySelectorAll(".ms-pick-dig button").length === 50 && !d.querySelector(".ms-pick-dig .is-open"); };
  var mineAt = function (rows) { for (var r = 0; r < rows.length; r++) for (var c = 0; c < 10; c++) if (rows[r][c] === "M") return r + "," + c; };
  ok(closedAll() && w.__ms.puzzle() === null, "énigme : toute fermée avant le premier coup");
  dig(w.__ms.puzzleStart());
  var pz = w.__ms.puzzle();
  ok(pz && pz.rows.length === 5 && pz.path.length >= 20 && pz.path[0].split(",")[0] === "0" && pz.path[pz.path.length - 1].split(",")[1] === "9" && pz.path.every(function (k) { var p = k.split(","); return pz.rows[p[0]][p[1]] === "P"; }), "énigme : grille tirée au premier coup, serpent d'une case du haut au bord droit (" + (pz && pz.path.length) + " cases)");
  ok(!btn(w.__ms.puzzleStart()) && !d.querySelector(".ms-pick-dig .is-boom"), "énigme : le premier coup est sûr");
  dig(mineAt(pz.rows));
  await wait(1200);
  ok(closedAll() && w.__ms.puzzle() === null && !pick.classList.contains("is-unlocked"), "énigme : une mine, tout recommence, fermé");
  dig(w.__ms.puzzleStart());
  d.getElementById("ms-pick-cancel").click();
  d.getElementById("ms-new").click();
  ok(closedAll(), "énigme : fenêtre fermée, les cases creusées sont oubliées");
  dig(w.__ms.puzzleStart());
  pz = w.__ms.puzzle();
  // garde pour la fin une case à chiffre qu'aucune case vide n'ouvrira
  var num = function (k) { var p = k.split(",").map(Number), n = 0; for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) { var row = pz.rows[p[0] + dr]; if ((dr || dc) && row && row[p[1] + dc] === "M") n++; } return n; };
  var near = function (a, b) { var p = a.split(",").map(Number), q = b.split(",").map(Number); return Math.abs(p[0] - q[0]) <= 1 && Math.abs(p[1] - q[1]) <= 1; };
  var last = pz.safe.filter(function (k) { return btn(k) && num(k) && pz.safe.every(function (j) { return j === k || !near(j, k) || num(j); }); })[0];
  pz.safe.forEach(function (k) { if (k !== last) dig(k); });
  ok(last && !pick.classList.contains("is-unlocked"), "énigme : une case sûre encore fermée, rien ne s'ouvre");
  dig(last);
  await wait(1600);
  ok(pick.classList.contains("is-unlocked") && JSON.parse(w.localStorage.getItem("ms-noflag-v1")) === true, "énigme résolue : chemin débloqué et gardé");
  ok(!d.querySelector('[data-rank-level="noflag"]').hidden, "classement : onglet Sans drapeau visible après l'énigme");
  ok(Array.prototype.every.call(d.querySelectorAll(".ms-pick-dig .is-path"), function (c) { return c.textContent === ""; }) && d.querySelectorAll(".ms-pick-dig .is-path").length === pz.path.length, "énigme résolue : le chemin perd ses chiffres");
  ok(d.querySelector(".ms-pick-link").style.left !== "" && w.getComputedStyle(d.querySelector(".ms-pick-link")).transform === "none", "énigme résolue : un trait relie le rail à l'entrée du chemin");
  ok(d.getElementById("ms-pick-name").textContent === "Sans drapeau", "le curseur part sur le chemin : Sans drapeau");
  d.getElementById("ms-pick-go").click();
  ok(w.__ms.level() === "noflag" && d.querySelectorAll(".ms-board .ms-cell").length === 16 * 16 && /Pas de drapeau/.test(d.getElementById("ms-status").textContent), "partie Sans drapeau lancée, 16 × 16");
  await wait(400);
  var nfCells = d.querySelectorAll(".ms-board .ms-cell");
  tap(w, nfCells[0]);
  var shut = Array.prototype.find.call(d.querySelectorAll(".ms-board .ms-cell"), function (c) { return !c.classList.contains("is-open"); });
  shut.dispatchEvent(new w.MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
  ok(!d.querySelector(".ms-board .is-flag") && w.__ms.game().actions.every(function (x) { return x.a !== "f"; }), "Sans drapeau : clic droit sans effet");

  document.getElementById("out").textContent = log.join("\n");
};
window.addEventListener("error", function (e) { log.push("ERREUR " + e.message); });
// une erreur dans la suite asynchrone des tests : on l'affiche au lieu de rester sur « pending »
window.addEventListener("unhandledrejection", function (e) { log.push("ERREUR " + (e.reason && e.reason.stack || e.reason)); document.getElementById("out").textContent = log.join("\n"); });
</script>
