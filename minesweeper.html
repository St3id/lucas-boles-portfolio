<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Démineur - Lucas Boles</title>
  <meta name="description" content="Un démineur codé en JavaScript pour le portfolio de Lucas Boles.">
  <link rel="canonical" href="https://st3id.github.io/lucas-boles-portfolio/minesweeper.html">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css?v=16e05981">
  <link rel="stylesheet" href="assets/css/minesweeper.css?v=e8cabd61">
  <script src="assets/js/minesweeper.js?v=f2bbd315" defer></script>
</head>
<body class="ms-page">
  <a class="skip-link" href="#jeu" data-i18n="skip">Aller au jeu</a>
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="./" data-back>Lucas Boles</a>
      <a class="lang-link" href="?lang=en" data-lang-switch>EN</a>
      <a class="text-link" href="./" data-back data-i18n="back">Retour au portfolio</a>
    </div>
  </header>

  <main id="jeu" class="page wrap ms">
    <h1 class="ms-title" data-i18n="title">Démineur</h1>
    <p class="lead ms-lead" data-i18n="lead">Trouver toutes les cases sûres sans toucher une mine.</p>

    <div class="ms-bar">
      <div class="ms-levels" role="group" aria-label="Difficulté" data-i18n-aria="levels">
        <button type="button" class="ms-level" data-level="easy" aria-pressed="true" data-i18n="easy">Facile</button>
        <button type="button" class="ms-level" data-level="medium" aria-pressed="false" data-i18n="medium">Moyen</button>
        <button type="button" class="ms-level" data-level="hard" aria-pressed="false" data-i18n="hard">Difficile</button>
      </div>
      <dl class="ms-stats">
        <div><dt data-i18n="minesLeft">Mines restantes</dt><dd id="ms-mines">10</dd></div>
        <div><dt data-i18n="time">Temps</dt><dd id="ms-time">00:00</dd></div>
      </dl>
    </div>

    <div class="ms-tools">
      <button type="button" class="ms-flag-mode" id="ms-flag-mode" aria-pressed="false" data-i18n="flagMode">Mode drapeau</button>
      <button type="button" class="button" id="ms-new" data-i18n="newGame">Nouvelle partie</button>
    </div>

    <div class="ms-board-wrap">
      <div class="ms-board" id="ms-board" role="grid" aria-label="Grille du démineur" data-i18n-aria="board"></div>
    </div>

    <p class="ms-status" id="ms-status" aria-live="polite"></p>

    <section class="ms-help" aria-labelledby="ms-help-title">
      <h2 id="ms-help-title" data-i18n="howTo">Comment jouer</h2>
      <ul id="ms-help-list"></ul>
    </section>
  </main>

  <div class="ms-end" id="ms-end" hidden>
    <div class="ms-end-card" role="dialog" aria-modal="true" aria-labelledby="ms-end-title">
      <h2 id="ms-end-title"></h2>
      <p id="ms-end-text"></p>
      <div class="ms-end-actions">
        <button type="button" class="button" id="ms-end-new" data-i18n="newGame">Nouvelle partie</button>
        <button type="button" class="ms-end-close" id="ms-end-close" data-i18n="close">Fermer</button>
      </div>
    </div>
  </div>

  <div class="ms-code" id="ms-code" hidden>
    <div class="ms-code-card" role="dialog" aria-modal="true" aria-label="Code">
      <button type="button" class="ms-code-close" id="ms-code-close" aria-label="Fermer" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="ms-pad">
        <button type="button" class="ms-key ms-key-up" data-key="up" aria-label="Haut" data-i18n-aria="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6l7 9H5z"/></svg></button>
        <button type="button" class="ms-key ms-key-left" data-key="left" aria-label="Gauche" data-i18n-aria="left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12l9-7v14z"/></svg></button>
        <span class="ms-pad-center" aria-hidden="true"></span>
        <button type="button" class="ms-key ms-key-right" data-key="right" aria-label="Droite" data-i18n-aria="right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 12l-9 7V5z"/></svg></button>
        <button type="button" class="ms-key ms-key-down" data-key="down" aria-label="Bas" data-i18n-aria="down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18l-7-9h14z"/></svg></button>
      </div>
      <div class="ms-ab">
        <button type="button" class="ms-key ms-key-round" data-key="b" aria-label="B">B</button>
        <button type="button" class="ms-key ms-key-round" data-key="a" aria-label="A">A</button>
      </div>
    </div>
  </div>
</body>
</html>
